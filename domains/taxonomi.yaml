# Sakpolitisk domäntaxonomi - riksdagsvalet 2026
# Version 0.6.4 (2026-09-13)
#
# Neutral hierarki som INTE följer något partis egen kapitelindelning.
# Partiets egen rubrik bevaras separat på varje förslag (falt: partiets_egen_rubrik)
# så att bada lagren kan jamforas: sakfraga (denna taxonomi) och inramning (partiets egen).
#
# nyckelord anvands for automatisk forstataggning. De ar avsiktligt breda -
# manuell granskning forutsatts. Se CHANGELOG for metodnoteringar.

