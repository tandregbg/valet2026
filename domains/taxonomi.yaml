# Tvargaende konfliktaxlar. Ett forslag kan bara flera axlar samtidigt,
# oberoende av vilken domain det tillhor. Det ar har de mest intressanta
# monstren brukar synas - de som ingen enskild domain fangar.
axlar:
  # Endast flerordiga, stallningstagande fraser. Enstaka ord som "marknad"
  # eller "valfrihet" duger inte - de forekommer lika ofta hos den som ar
  # emot som hos den som ar for ("avskaffa lagen om valfrihet").
  - id: stat-marknad
    namn: Stat vs marknad
    pol_a: Mer offentligt
    pol_b: Mer marknad
    nyckelord_a: [stoppa vinstjakten, vinster i välfärden, vinstförbud, förstatliga,
                  offentlig regi, avprivatisering, i gemensam ägo, icke vinstdrivande,
                  begränsa vinstuttag, återta driften]
    nyckelord_b: [fritt vårdval, ökad valfrihet, fler privata utförare, konkurrensutsätta,
                  avreglera, privata alternativ, lov i vården, entreprenad,
                  utmaningsrätt, fler aktörer]

  - id: centralisering
    namn: Centralisering vs decentralisering
    pol_a: Centralisera
    pol_b: Decentralisera
    nyckelord_a: [statligt huvudmannaskap, nationellt ansvar, avveckla regionerna, staten ska ta över]
    nyckelord_b: [kommunalt självstyre, lokalt beslutsfattande, närmare medborgarna, decentralisera]

  - id: stad-landsbygd
    namn: Stad vs landsbygd
    pol_a: Storstadsfokus
    pol_b: Landsbygdsfokus
    nyckelord_a: [storstadsregioner, urbanisering, förtätning, storstädernas behov]
    nyckelord_b: [hela landet ska leva, landsbygden, glesbygd, service i hela landet,
                  regional utveckling, mindre orter]

  - id: frihet-kontroll
    namn: Frihet vs kontroll
    pol_a: Mer kontroll
    pol_b: Mer frihet
    nyckelord_a: [inför förbud, åldersgräns för, utökad övervakning, tillståndsplikt,
                  skärpta krav, kameraövervakning, anmälningsplikt]
    nyckelord_b: [avskaffa förbudet, individens frihet, eget ansvar, självbestämmande,
                  minska regelbördan, ta bort kravet]

  - id: nationellt-internationellt
    namn: Nationellt vs internationellt
    pol_a: Nationell suveränitet
    pol_b: Internationellt samarbete
    nyckelord_a: [nationell suveränitet, svenska intressen först, behåll vetorätten,
                  mindre makt till eu, självständig valuta, nej till euron]
    nyckelord_b: [fördjupat eu-samarbete, gemensamma europeiska regler, internationellt samarbete,
                  stärkt fn, global samverkan]

# Utsagetyper. Skillnaden spelar roll: en vision och ett kvantifierat
# lofte ar inte samma sorts pastaende och bor inte raknas ihop rakt av.
typer:
  - id: reform
    namn: Konkret reform
    beskrivning: Atgard som kan genomforas och foljas upp
  - id: mal
    namn: Mål
    beskrivning: Onskat utfall utan angiven metod
  - id: princip
    namn: Princip/vision
    beskrivning: Vardering eller inriktning
  - id: kritik
    namn: Kritik
    beskrivning: Invandning mot motstandare eller nulage
